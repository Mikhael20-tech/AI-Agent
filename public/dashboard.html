    function App() {

      const [searchQuery, setSearchQuery] = useState('');

      ]);
      const [isSending, setIsSending] = useState(false);
      const [audioPlaying, setAudioPlaying] = useState(false);
      const [audioUrl, setAudioUrl] = useState(null);
      const [wsStatus, setWsStatus] = useState('CONNECTING');

      const audioRef = useRef(new Audio());

      // Fetch Data Initial
      const fetchInitialData = async () => {
        try {
          const [draftsRes, auditRes, reconRes] = await Promise.all([
            fetch('/api/drafts').then(r => r.json()).catch(() => []),
            fetch('/api/audit-logs').then(r => r.json()).catch(() => []),
            fetch('/api/reconciliation').then(r => r.json()).catch(() => null)
          ]);
          setDrafts(Array.isArray(draftsRes) ? draftsRes : []);
          setAuditLogs(Array.isArray(auditRes) ? auditRes : []);
          setReconciliation(reconRes);
        } catch (err) {
          console.error('Gagal mengambil data dashboard:', err);
        }
      };

      useEffect(() => {
        fetchInitialData();

        // WebSocket Connection
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        let ws;

        try {
          ws = new WebSocket(wsUrl);
          ws.onopen = () => setWsStatus('CONNECTED');
          ws.onclose = () => setWsStatus('DISCONNECTED');
          ws.onerror = () => setWsStatus('OFFLINE');

          ws.onmessage = (event) => {
            try {
              const msg = JSON.parse(event.data);
              if (msg.type === 'INIT_STATE') {
                if (msg.drafts) setDrafts(msg.drafts);
                if (msg.audit_logs) setAuditLogs(msg.audit_logs);
                if (msg.reconciliation) setReconciliation(msg.reconciliation);
              } else if (msg.type === 'DRAFT_CREATED' || msg.type === 'DRAFT_UPDATED') {
                fetchInitialData();
              } else if (msg.type === 'AUDIT_UPDATED') {
                if (msg.data) setAuditLogs(msg.data);
              } else if (msg.type === 'EMPLOYEE_SPEECH') {
                showToast(`💬 ${msg.name}: "${msg.speech.slice(0, 70)}..."`);
              }
            } catch (e) {
              console.error('WS Parse error:', e);
            }
          };
        } catch (e) {
          setWsStatus('OFFLINE');
        }

        return () => {
          if (ws) ws.close();
        };
      }, []);

      const showToast = (text) => {
        setNotification(text);
        setTimeout(() => setNotification(null), 5000);
      };

      // Review Draft (Four-Eyes Approval / Rejection)
      const handleReview = async (id, action) => {
        try {
          const res = await fetch(`/api/drafts/${id}/review`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action })
          });
          const result = await res.json();
          if (result.success) {
            showToast(action === 'APPROVE' ? `✅ Draft #${id} disetujui & diposting ke GL!` : `❌ Draft #${id} berhasil ditolak.`);
            fetchInitialData();
          } else {
            alert(result.message || 'Gagal memproses draf');
          }
        } catch (err) {
          alert('Error: ' + err.message);
        }
      };

      // Kirim Chat / Tugas ke Karyawan AI
      const handleSendMessage = async (e) => {
        e?.preventDefault();
        if (!chatInput.trim() || isSending) return;

        const userMsg = chatInput.trim();
        setChatInput('');
        setChatMessages(prev => [...prev, { sender: 'Pak Mikhael (Finance Lead)', text: userMsg, time: 'Baru saja' }]);
        setIsSending(true);

        try {
          const res = await fetch('/api/chat-employee', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              empId: activeEmployee.id,
              message: userMsg,
              fromUser: 'Pak Mikhael'
            })
          });
          const data = await res.json();
          if (data.success && data.speech) {
            setChatMessages(prev => [...prev, {
              sender: `${data.name} (${data.role})`,
              text: data.speech,
              time: 'Baru saja',
              isBot: true
            }]);
          } else {
            setChatMessages(prev => [...prev, {
              sender: 'Sistem',
              text: 'Karyawan sedang memproses tugas di latar belakang...',
              time: 'Baru saja'
            }]);
          }
        } catch (err) {
          setChatMessages(prev => [...prev, {
            sender: 'Error',
            text: 'Gagal menghubungi agen: ' + err.message,
            time: 'Baru saja'
          }]);
        } finally {
          setIsSending(false);
        }
      };

        if (audioPlaying) {
          audioRef.current.pause();
          setAudioPlaying(false);
          return;
        }

        try {
          setAudioPlaying(true);
          const res = await fetch('/api/voice/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: textToSpeak.slice(0, 200) })
          });
          const data = await res.json();
          if (data.success && data.audioUrl) {
            audioRef.current.src = data.audioUrl;
            audioRef.current.play();
            audioRef.current.onended = () => setAudioPlaying(false);
            audioRef.current.onerror = () => {
              alert('Gagal memutar audio voice note');
              setAudioPlaying(false);
            };
          }
        } catch (err) {
          alert('Error voice generator: ' + err.message);
          setAudioPlaying(false);
        }

      // Filter Employees

      });

                  </div>
                  <a

                  >
                    <span>📅 Unduh Kalender .XLSX</span>

                {/* 3. Social Media PNG Poster (NEW) */}
                <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-4 hover:border-violet-500/50 transition group flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between mb-2">

                      <span className="text-xs text-slate-500">1080×1350</span>
                    </div>
                    <h4 className="font-semibold text-sm text-slate-100 group-hover:text-violet-400 transition">Poster Edukasi Feed IG 4:5</h4>
                    <p className="text-[11px] text-slate-400 mt-1 leading-relaxed">
                      Poster infografis 1080×1350px siap upload ke Instagram & LinkedIn dengan visual 3 modus fraud dan Four-Eyes Principle.
                    </p>
                  </div>
                  <a 
                    href="/api/download/poster-png" 
                    download
                    className="mt-4 w-full bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-500 hover:to-purple-500 text-white font-medium text-xs py-2 px-3 rounded-lg text-center flex items-center justify-center space-x-1.5 shadow-md transition"
                  >
                    <span>🎨 Unduh Poster .PNG</span>
                  </a>
                </div>

                {/* 4. Payroll PDF */}
                <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-4 hover:border-rose-500/50 transition group flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-xs font-bold text-rose-400 bg-rose-950/60 px-2 py-0.5 rounded border border-rose-800/60">RESMI PDF</span>
                      <span className="text-xs text-slate-500">Disburse BCA</span>
                    </div>
                    <h4 className="font-semibold text-sm text-slate-100 group-hover:text-rose-400 transition">Rekap Gaji Payroll Karyawan</h4>
                    <p className="text-[11px] text-slate-400 mt-1 leading-relaxed">

                    </p>
                  </div>
                  <a

                  >
                    <span>📑 Unduh Slip Gaji PDF</span>

                </div>

                {/* 5. Sales & Finance Excel */}
                <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-4 hover:border-cyan-500/50 transition group flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-xs font-bold text-cyan-400 bg-cyan-950/60 px-2 py-0.5 rounded border border-cyan-800/60">SPREADSHEET</span>
                      <span className="text-xs text-slate-500">Multi-Sheet</span>
                    </div>
                    <h4 className="font-semibold text-sm text-slate-100 group-hover:text-cyan-400 transition">Rekap Omset Penjualan Rp 1,2M</h4>
                    <p className="text-[11px] text-slate-400 mt-1 leading-relaxed">
                      Data transaksi penjualan enterprise paket Seventhsoft Cloud, rekonsiliasi kas, & daftar faktur komprehensif.
                    </p>
                  </div>
                  <a 
                    href="/api/export-excel?type=all" 
                    download
                    className="mt-4 w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-medium text-xs py-2 px-3 rounded-lg text-center flex items-center justify-center space-x-1.5 shadow-md transition"
                  >
                    <span>📈 Unduh Rekap Excel</span>
                  </a>
                </div>
              </div>

            {/* SECTION 3: FULL DATABASE DRAFTS & INVOICE MANAGEMENT */}
            <div className="glass-panel p-6 rounded-2xl">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                <div>
                  <h2 className="text-lg font-bold text-white flex items-center space-x-2">
                    <span>🗄️</span>
                    <span>Database Transaksi & Draf Jurnal (Four-Eyes Verification)</span>
                  </h2>
                  <p className="text-xs text-slate-400 mt-0.5">Persetujuan ganda Maker-Checker sebelum transaksi resmi diposting ke General Ledger Seventhsoft</p>
                </div>
                <div className="flex items-center space-x-2">
                  <button 
                    onClick={fetchInitialData}
                    className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center space-x-1"
                  >
                    <span>🔄 Refresh Data</span>
                  </button>
                </div>
              </div>

              <div className="overflow-x-auto rounded-xl border border-slate-800 bg-slate-900/60">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-900 text-slate-400 font-semibold border-b border-slate-800 uppercase text-[10px] tracking-wider">
                    <tr>
                      <th className="py-3 px-4">Draft ID</th>
                      <th className="py-3 px-4">Vendor / Rekanan</th>
                      <th className="py-3 px-4">Deskripsi Pembelian</th>
                      <th className="py-3 px-4 text-right">DPP (Rp)</th>
                      <th className="py-3 px-4 text-right">PPN 11%</th>
                      <th className="py-3 px-4 text-right">Grand Total</th>
                      <th className="py-3 px-4 text-center">Status</th>
                      <th className="py-3 px-4 text-center">Aksi Otorisasi</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800 text-slate-300">
                    {drafts.length === 0 ? (
                      <tr>
                        <td colSpan="8" className="py-8 text-center text-slate-500">
                          Belum ada data draf faktur yang perlu ditinjau.
                        </td>
                      </tr>
                    ) : (
                      drafts.map((d) => (
                        <tr key={d.id} className="hover:bg-slate-800/40 transition">
                          <td className="py-3 px-4 font-mono font-medium text-cyan-400">{d.id}</td>
                          <td className="py-3 px-4 font-medium text-white">{d.vendor_name || d.supplier_name || '-'}</td>
                          <td className="py-3 px-4 text-slate-400 max-w-xs truncate">{d.description || d.raw_content || 'Pengadaan Operasional'}</td>
                          <td className="py-3 px-4 text-right font-mono">{(d.dpp || 0).toLocaleString('id-ID')}</td>
                          <td className="py-3 px-4 text-right font-mono">{(d.ppn || 0).toLocaleString('id-ID')}</td>
                          <td className="py-3 px-4 text-right font-mono font-bold text-slate-100">{(d.grand_total || d.total_amount || 0).toLocaleString('id-ID')}</td>
                          <td className="py-3 px-4 text-center">
                            {d.status === 'POSTED' && (
                              <span className="bg-emerald-950/80 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded-full text-[10px] font-semibold">
                                ✓ POSTED
                              </span>
                            )}
                            {d.status === 'PENDING_APPROVAL' && (
                              <span className="bg-amber-950/80 text-amber-400 border border-amber-800 px-2 py-0.5 rounded-full text-[10px] font-semibold animate-pulse">
                                ⏳ PENDING
                              </span>
                            )}
                            {d.status === 'REJECTED' && (
                              <span className="bg-rose-950/80 text-rose-400 border border-rose-800 px-2 py-0.5 rounded-full text-[10px] font-semibold">
                                ✕ REJECTED
                              </span>
                            )}
                          </td>
                          <td className="py-3 px-4 text-center">
                            {d.status === 'PENDING_APPROVAL' ? (
                              <div className="flex items-center justify-center space-x-1.5">
                                <button 
                                  onClick={() => handleReview(d.id, 'APPROVE')}
                                  className="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded font-medium text-[11px] transition"
                                  title="Setujui dan posting ke GL"
                                >
                                  ✓ Setujui
                                </button>
                                <button 
                                  onClick={() => handleReview(d.id, 'REJECT')}
                                  className="bg-rose-600 hover:bg-rose-500 text-white px-2.5 py-1 rounded font-medium text-[11px] transition"
                                  title="Tolak draft"
                                >
                                  ✕ Tolak
                                </button>
                              </div>
                            ) : (
                              <span className="text-[11px] text-slate-500 font-mono">
                                {d.approver_user_id || 'Selesai Diproses'}
                              </span>
                            )}
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              
              {/* Left Column: 30 Employees Roster */}
              <div className="lg:col-span-1 glass-panel p-5 rounded-2xl flex flex-col h-[560px]">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="font-bold text-sm text-white flex items-center space-x-2">
                    <span>👥</span>
                    <span>30 Staf AI Kantor</span>
                  </h3>
                  <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full border border-slate-700">
                    {filteredEmployees.length} Tampil
                  </span>
                </div>

                {/* Filter Department */}
                <div className="flex space-x-1 mb-3 text-[11px] overflow-x-auto pb-1 custom-scrollbar">
                  {['ALL', 'Engineering', 'Sales', 'Finance', 'Operations'].map((dept) => (
                    <button
                      key={dept}
                      onClick={() => setSelectedDept(dept)}
                      className={`px-2.5 py-1 rounded-lg font-medium whitespace-nowrap transition ${
                        selectedDept === dept ? 'bg-blue-600 text-white' : 'bg-slate-900 text-slate-400 hover:bg-slate-800'
                      }`}
                    >
                      {dept}
                    </button>
                  ))}
                </div>

                {/* Search Box */}
                <input
                  type="text"
                  placeholder="Cari nama atau keahlian..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 mb-3"
                />

                {/* List Staf */}
                <div className="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                  {filteredEmployees.map((emp) => (
                    <div
                      key={emp.id}
                      onClick={() => setActiveEmployee(emp)}
                      className={`p-2.5 rounded-xl border cursor-pointer transition flex items-center justify-between ${
                        activeEmployee?.id === emp.id 
                          ? 'bg-blue-900/30 border-blue-500/70 shadow-sm' 
                          : 'bg-slate-900/60 border-slate-800 hover:bg-slate-800/60 hover:border-slate-700'
                      }`}
                    >
                      <div className="flex items-center space-x-3">
                        <div className="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-base">
                          {emp.icon}
                        </div>
                        <div>
                          <div className="font-semibold text-xs text-slate-200">{emp.name}</div>
                          <div className="text-[10px] text-slate-400 truncate max-w-[140px]">{emp.role}</div>
                        </div>
                      </div>
                      <span className="text-[10px] bg-emerald-950/60 text-emerald-400 border border-emerald-800/60 px-1.5 py-0.5 rounded">
                        ● {emp.status}
                      </span>
                    </div>
                  ))}
                </div>
              </div>

              {/* Right Column: Interactive Direct Task & Speech Console */}
              <div className="lg:col-span-2 glass-panel p-5 rounded-2xl flex flex-col h-[560px]">
                {/* Active Employee Banner */}
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center space-x-3">
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-xl shadow-md">
                      {activeEmployee.icon}
                    </div>
                    <div>
                      <h4 className="font-bold text-sm text-white flex items-center space-x-2">
                        <span>{activeEmployee.name}</span>
                        <span className="text-[10px] font-normal text-cyan-400 bg-cyan-950/70 border border-cyan-800 px-2 py-0.2 rounded-full">
                          {activeEmployee.dept}
                        </span>
                      </h4>
                      <p className="text-xs text-slate-400">{activeEmployee.role} — <span className="text-slate-300">{activeEmployee.desc}</span></p>
                    </div>
                  </div>

                  {/* Voice Button */}
                  <button
                    onClick={() => {
                      const lastBotMsg = [...chatMessages].reverse().find(m => m.isBot)?.text || activeEmployee.desc;
                      handlePlayVoice(lastBotMsg);
                    }}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium border flex items-center space-x-1.5 transition ${
                      audioPlaying 
                        ? 'bg-rose-600 text-white border-rose-500 animate-pulse' 
                        : 'bg-slate-800 hover:bg-slate-700 text-cyan-400 border-slate-700'
                    }`}
                  >
                    <span>{audioPlaying ? '⏹️ Berhenti' : '🎙️ Putar Voice Note'}</span>
                  </button>
                </div>

                {/* Dialog Feed */}
                <div className="flex-1 overflow-y-auto p-3 space-y-3 custom-scrollbar">
                  {chatMessages.map((msg, i) => (
                    <div 
                      key={i} 
                      className={`flex flex-col ${msg.sender.includes('Pak Mikhael') ? 'items-end' : 'items-start'}`}
                    >
                      <div className="text-[10px] text-slate-400 mb-1 flex items-center space-x-1">
                        <span className="font-semibold">{msg.sender}</span>
                        <span>•</span>
                        <span>{msg.time}</span>
                      </div>
                      <div 
                        className={`max-w-[85%] rounded-2xl px-4 py-2.5 text-xs leading-relaxed ${
                          msg.sender.includes('Pak Mikhael')
                            ? 'bg-blue-600 text-white rounded-tr-none'
                            : 'bg-slate-800 text-slate-200 border border-slate-700/80 rounded-tl-none font-mono'
                        }`}
                        style={{ whiteSpace: 'pre-wrap' }}
                      >
                        {msg.text}
                      </div>
                    </div>
                  ))}
                  {isSending && (
                    <div className="flex items-center space-x-2 text-xs text-slate-400 italic">
                      <span className="animate-spin">⚙️</span>
                      <span>{activeEmployee.name} sedang memproses instruksi teknis...</span>
                    </div>
                  )}
                </div>

                {/* Quick Prompts */}
                <div className="pt-2 flex items-center space-x-2 text-[11px] overflow-x-auto pb-1 text-slate-400 custom-scrollbar">
                  <span className="text-[10px] text-slate-500">Contoh:</span>
                  <button 
                    onClick={() => setChatInput('Bagus, buatkan carousel tips rekrut karyawan keuangan')}
                    className="bg-slate-900 hover:bg-slate-800 px-2 py-1 rounded border border-slate-800 whitespace-nowrap"
                  >
                    💡 Buat Carousel
                  </button>
                  <button 
                    onClick={() => setChatInput('Sarah, buatkan komponen form input invoice pakai React dan Tailwind')}
                    className="bg-slate-900 hover:bg-slate-800 px-2 py-1 rounded border border-slate-800 whitespace-nowrap"
                  >
                    💻 Buat Web React
                  </button>
                  <button 
                    onClick={() => setChatInput('Deni, berikan checklist audit internal kasir')}
                    className="bg-slate-900 hover:bg-slate-800 px-2 py-1 rounded border border-slate-800 whitespace-nowrap"
                  >
                    🛡️ Audit Kasir
                  </button>
                  <button 
                    onClick={() => setChatInput('Doni, minta rekap slip gaji dan tunjangan')}
                    className="bg-slate-900 hover:bg-slate-800 px-2 py-1 rounded border border-slate-800 whitespace-nowrap"
                  >
                    💵 Cek Payroll
                  </button>
                </div>

                {/* Input Bar */}
                <form onSubmit={handleSendMessage} className="pt-2 flex items-center space-x-2 border-t border-slate-800">
                  <input
                    type="text"
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    placeholder={`Beri tugas atau ajak bicara ${activeEmployee.name}...`}
                    className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"
                  />
                  <button
                    type="submit"
                    disabled={isSending || !chatInput.trim()}
                    className="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white px-5 py-2.5 rounded-xl font-medium text-xs shadow-md transition flex items-center space-x-1"
                  >
                    <span>Kirim</span>
                    <span>➤</span>
                  </button>
                </form>
              </div>

            </div>

            {/* SECTION 5: LIVE AUDIT TRAIL LOGS */}
            <div className="glass-panel p-5 rounded-2xl">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center space-x-2">
                  <span className="text-base">📜</span>
                  <h3 className="font-bold text-sm text-white">Log Audit Kepatuhan Regulasi (UU ITE & UU PDP No. 27/2022)</h3>
                </div>
                <span className="text-[11px] text-emerald-400 font-mono bg-emerald-950/70 border border-emerald-800 px-2.5 py-0.5 rounded-full">
                  Immutable Blockchain Hash
                </span>
              </div>
              <div className="max-h-44 overflow-y-auto rounded-xl border border-slate-800 bg-slate-900/60 p-2 font-mono text-[11px] space-y-1.5 custom-scrollbar">
                {auditLogs.length === 0 ? (
                  <div className="text-center py-4 text-slate-500">Belum ada riwayat audit log.</div>
                ) : (
                  auditLogs.slice(0, 8).map((log, idx) => (
                    <div key={idx} className="flex items-center justify-between text-slate-300 hover:bg-slate-800/40 p-1.5 rounded transition">
                      <div className="flex items-center space-x-3">
                        <span className="text-slate-500">[{new Date(log.created_at || Date.now()).toLocaleTimeString('id-ID')}]</span>
                        <span className="font-semibold text-cyan-400">{log.action || log.event_type}</span>
                        <span className="text-slate-300">{log.details || log.description || 'Pencatatan transaksi akuntansi'}</span>
                      </div>
                      <span className="text-[10px] text-slate-500 truncate max-w-[120px]">
                        ID: {log.user_id || 'System'}
                      </span>
                    </div>
                  ))
                )}
              </div>
            </div>

          </main>

          {/* FOOTER */}
          <footer className="glass-panel border-t border-slate-800 py-4 px-6 text-center text-xs text-slate-400">
            <p>© 2026 PT Seventhsoft Teknologi Indonesia. All Rights Reserved. Enterprise AI Architecture for Modern Accounting.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
